<style>
/* ============ Tokens ============ */
:root{
  --paper:#ffffff; --surface:#f1f2f0; --surface-2:#e4e6e3; --ink:#121417; --ink-soft:#4a4f57;
  --eu-field:#a7ff9c; --eu-ink:#11632b;    /* Europa: Mint */
  --sa-field:#ff6831; --sa-ink:#a8380c;    /* Südamerika: Orange */
  --as-field:#8ccfff; --as-ink:#0c5c94;    /* Asien: Himmelblau */
  --af-field:#ffd43b; --af-ink:#6d4f00;    /* Afrika: Sonnengelb */
  --pass:#7a1f33; --pass-gold:#f3d9a4; --pass-paper:#f4eef0; --pass-slot:#ebe1e5;
  --ok:#11632b; --ok-bg:#e6f6ea; --bad:#b42318; --bad-bg:#fdecea; --help-bg:#fff4cc;
  --globe-sea:#121417; --globe-land-1:#c9ced6; --globe-land-2:#8d949e; --globe-land-3:#5b616b;
  --f-display:'Anton','Arial Narrow',Arial,sans-serif;
  --f-text:'Work Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --step-small:0.875rem; --step-body:1.125rem; --step-lead:1.375rem;
  --step-head:clamp(2.25rem, 1.4rem + 3.6vw, 4rem); --step-mega:clamp(3.25rem, 1.6rem + 7vw, 6rem);
  --step-lede:clamp(1.1875rem, 1.05rem + 0.6vw, 1.375rem);
  --gutter:clamp(16px, 4vw, 32px); --measure:46rem; --read:40rem; --wide:72rem;
  --ease-out:cubic-bezier(0.23,1,0.32,1); --ease-in-out:cubic-bezier(0.77,0,0.175,1);
  --band:var(--surface-2); --topbar-h:64px; --field:var(--surface-2); --fink:var(--ink);
  color-scheme:light;
}

/* ============ Grundlagen ============ */
*,*::before,*::after{box-sizing:border-box}
html,body,h1,h2,h3,p,ol,ul,li,figure,fieldset,legend,dialog{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:calc(var(--topbar-h) + 12px);scrollbar-color:var(--ink-soft) var(--surface);overscroll-behavior-y:none}
body{overscroll-behavior-y:none}
body{background:var(--paper);color:var(--ink);font:400 var(--step-body)/1.6 var(--f-text);caret-color:var(--ink);accent-color:var(--ink)}
::selection{background:var(--as-field);color:var(--ink)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
h1[tabindex="-1"]:focus{outline:none}
a{color:var(--ink);text-underline-offset:3px;text-decoration-thickness:2px}
p,li{hyphens:auto;-webkit-hyphens:auto;hyphenate-limit-chars:7 3 3;text-wrap:pretty}
button,input,select,textarea{font:inherit;color:inherit}
svg{flex:none}
strong{font-weight:700}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.tnum{font-variant-numeric:tabular-nums}

.title-mega,.title-head,.h-sec,.part h2,.arena h2{font-family:var(--f-display);font-weight:400;text-transform:uppercase;line-height:1.15;letter-spacing:.005em;text-wrap:balance}
.title-mega{font-size:var(--step-mega)}
.title-head{font-size:var(--step-head)}
.h-sec{font-size:clamp(1.9rem, 1.5rem + 1.6vw, 2.75rem);margin:0 0 18px}
.h-card{font:700 1.375rem/1.3 var(--f-text);text-transform:none;letter-spacing:0;margin:0 0 10px}
.hello{overflow-wrap:anywhere}
.lede{font-size:var(--step-lede);line-height:1.45}
.kaya{font-size:var(--step-lede);line-height:1.45}
.small{font-size:var(--step-small);line-height:1.5;color:var(--ink-soft)}
.btn-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}

/* ============ Rahmen ============ */
.app{min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
#main{flex:1 0 auto}
.wrap{max-width:calc(var(--measure) + 2 * var(--gutter));margin:0 auto;padding:0 var(--gutter)}
.wide{max-width:calc(var(--wide) + 2 * var(--gutter));margin:0 auto;padding:0 var(--gutter)}
.screen{padding:48px 0 72px}

.topbar{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:6px solid var(--band);transition:border-color 300ms ease}
.topbar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:10px var(--gutter);max-width:calc(var(--wide) + 2 * var(--gutter));margin:0 auto}
.brand{font-family:var(--f-display);font-size:1.5rem;line-height:1;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap}
.ribbon{display:none;position:absolute;left:0;right:0;bottom:-6px;height:6px}
.ribbon i{flex:1;background:var(--c)}
.topbar.ribbon-on .ribbon{display:flex}
.pass-strip{display:flex;gap:4px;align-items:center}
.pass-strip[hidden]{display:none}
.slot{width:30px;height:36px;display:grid;place-items:center;font-family:var(--f-display);font-size:1.05rem;line-height:1;color:var(--ink-soft);background:var(--surface);font-variant-numeric:tabular-nums}
.slot.now{background:var(--paper);outline:3px solid var(--ink);outline-offset:-3px;color:var(--ink)}
.slot.done{background:var(--slot-field);color:var(--ink);transform:rotate(var(--rot,-6deg))}
@keyframes slotIn{from{opacity:0;transform:scale(1.8) rotate(calc(var(--rot,-6deg) - 12deg))}60%{opacity:1}to{opacity:1;transform:rotate(var(--rot,-6deg))}}
.slot.land{animation:slotIn 360ms var(--ease-out) 120ms both}
@media (max-width:380px){.slot{width:26px;height:32px}.brand{font-size:1.375rem}}

.site-footer{background:var(--surface);color:var(--ink-soft);font-size:.8125rem;line-height:1.5;text-align:center;padding:22px var(--gutter) 26px}
.site-footer a{color:inherit}

/* ============ Knöpfe und Felder ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:11px 22px;border:3px solid var(--ink);border-radius:0;background:var(--ink);color:#ffffff;font:700 1rem/1.25 var(--f-text);text-align:center;text-decoration:none;cursor:pointer;transition:transform 160ms var(--ease-out),background-color 150ms ease}
.btn svg{width:20px;height:20px}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.go{background:var(--eu-field);color:var(--ink)}
@media (hover:hover) and (pointer:fine){
  .btn:hover{background:#2b2f35}
  .btn.ghost:hover{background:var(--surface)}
  .btn.go:hover{background:#8ef182}
}
.btn:disabled,.btn[aria-disabled="true"],.btn:disabled:hover{background:var(--surface-2);color:var(--ink-soft);border-color:var(--ink-soft);cursor:not-allowed;transform:none}

.field{display:grid;gap:6px;align-content:start}
.field label{font-weight:600;font-size:1rem;line-height:1.35}
.input{width:100%;min-height:48px;padding:9px 12px;border:3px solid var(--ink);border-radius:0;background:var(--paper);color:var(--ink);font:600 1rem/1.3 var(--f-text)}
.input::placeholder{color:var(--ink-soft);font-weight:400;opacity:1}
.input[aria-invalid="true"]{border-color:var(--bad);background:var(--bad-bg)}
.frow{display:grid;gap:16px;margin-top:16px}
@media (min-width:600px){.frow{grid-template-columns:1fr 1fr}}
.form-error{margin-top:18px;padding:12px 16px;background:var(--bad-bg);color:var(--ink);font-weight:600;line-height:1.45}
.form-error:empty{display:none}

/* ============ Etikett, Hinweise ============ */
.tag{display:inline-flex;align-items:center;padding:8px 18px 8px 34px;background:var(--tag-bg,var(--field));color:var(--ink);font:700 var(--step-small)/1.25 var(--f-text);position:relative;clip-path:polygon(14px 0,100% 0,100% 100%,14px 100%,0 50%)}
.tag::before{content:'';position:absolute;left:14px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:var(--tag-hole,var(--paper))}
.notice{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;padding:16px 18px;background:var(--surface);color:var(--ink);font-size:1rem;line-height:1.5}
.notice svg{width:24px;height:24px;margin-top:1px}
.notice.warn{background:var(--help-bg)}
.st-head{display:grid;gap:16px;margin-bottom:28px}
.st-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.room-kind{font-size:var(--step-lede);font-weight:600;line-height:1.3;color:var(--ink-soft)}
/* Stationsband: Ankunft in einem neuen Kontinent – ganze Fläche in der Kontinentfarbe, Papier-Etikett, Stempel-Rohling */
.screen.has-band{padding-top:0}
.st-band{position:relative;overflow:hidden;background:var(--field);color:var(--ink);padding:40px 0 34px}
.st-band .st-head{margin-bottom:0}
.st-band .tag{--tag-bg:var(--paper);--tag-hole:var(--field)}
.st-band .room-kind{color:var(--ink)}
.band-stamp{display:none}
@media (min-width:1200px){
  .band-stamp{display:block;position:absolute;left:calc(50% + 23rem + 3.5rem);top:50%;width:150px;margin-top:-75px;color:var(--fink);transform:rotate(var(--r,-6deg))}
  .band-stamp svg{display:block;width:100%;height:auto}
}
.has-band .band-body{margin-top:40px}

/* ============ Start ============ */
.start{display:grid;gap:32px;grid-template-areas:"head" "globe" "form"}
.start-head{grid-area:head;display:grid;gap:18px}
.start-globe{grid-area:globe;width:100%;max-width:220px;justify-self:center}
.start-form{grid-area:form;max-width:40rem}
.start-form > form > p{margin-top:4px;line-height:1.55}
@media (min-width:900px){
  .start{grid-template-columns:minmax(0,7fr) minmax(0,5fr);grid-template-areas:"head globe" "form globe";column-gap:56px;row-gap:36px;align-items:start}
  .start-globe{max-width:440px;justify-self:end;width:100%}
}
.globe{display:block;width:100%;height:auto}
.save-load-field{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;margin-top:32px;padding:14px 18px;border:0;border-radius:0;background:var(--surface);color:var(--ink);font:600 1rem/1.35 var(--f-text);text-align:left;cursor:pointer;transition:transform 160ms var(--ease-out),background-color 150ms ease}
.save-load-field svg{width:24px;height:24px}
.save-load-field:active{transform:scale(.99)}
@media (hover:hover) and (pointer:fine){.save-load-field:hover{background:var(--surface-2)}}

/* ============ Zwischenstand ============ */
.resume-box{max-width:40rem;margin-top:24px}
.resume-box > p{line-height:1.55}
.save-drop{position:relative;display:flex;align-items:center;gap:16px;margin-top:22px;padding:22px;background:var(--surface);border:3px solid var(--ink);cursor:pointer;line-height:1.45}
.save-drop svg{width:32px;height:32px}
.save-drop input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.save-drop:focus-within{outline:3px solid var(--ink);outline-offset:3px}
.save-drop.drag{background:var(--as-field)}
.input-error{display:none;margin-top:14px;padding:12px 16px;background:var(--bad-bg);color:var(--ink);font-weight:600;line-height:1.45}
.save-bar{margin-top:48px;padding:20px var(--gutter);background:var(--surface);display:flex;justify-content:center}
.room-screen + .save-bar{margin-top:0;padding-top:0}
[data-save-slot] .save-bar{margin-top:0;padding:20px 24px;justify-content:flex-start}
.save-btn svg{width:20px;height:20px}
.save-toast{position:fixed;left:50%;bottom:24px;z-index:100;max-width:min(560px,calc(100vw - 32px));padding:14px 18px;background:var(--ink);color:#ffffff;font-weight:600;font-size:1rem;line-height:1.45;opacity:0;transform:translate(-50%,12px);pointer-events:none;transition:opacity 200ms var(--ease-out),transform 200ms var(--ease-out)}
.save-toast.show{opacity:1;transform:translate(-50%,0)}

/* ============ Ablauf-Seite ============ */
.video{aspect-ratio:16/9;background:var(--ink)}
.video iframe{display:block;width:100%;height:100%;border:0}
.video-fallback{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:12px;font-size:1rem}
.intro-head{display:grid;gap:18px;margin-top:40px}
.block{margin-top:56px}
.routemap{display:block;width:100%;height:auto;margin:0 0 20px;background:var(--surface)}
.steps{padding-left:1.4em;display:grid;gap:12px}
.steps li{padding-left:.3em}
.steps li::marker{font-weight:700}
.notes-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;padding:22px 24px;background:var(--af-field);color:var(--ink)}
.notes-card > svg{width:28px;height:28px;margin-top:2px}

/* ============ Globus-Bildschirm und Route ============ */
.globe-screen{display:grid;gap:24px}
.globe-box .globe{max-width:min(400px,72vw);margin:0 auto}
.caption{margin-top:10px;font-size:var(--step-small);line-height:1.45;color:var(--ink-soft);text-align:center}
.globe-info{display:grid;gap:18px;align-content:start}
.globe-info .tag{justify-self:start}
.globe-info .globe-go{margin:6px 0 10px}
@media (min-width:760px){.globe-screen{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:48px;align-items:start}}
.route{list-style:none;display:grid;gap:6px;padding:0}
.tile{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:2px 14px;align-items:center;padding:12px 14px;background:var(--surface)}
.tile .tn{width:44px;height:44px;display:grid;place-items:center;background:var(--tf);color:var(--ink);font-family:var(--f-display);font-size:1.6rem;line-height:1}
.tile .tx{min-width:0}
.tile .tp{display:block;font-size:var(--step-small);line-height:1.35;color:var(--ink-soft)}
.tile .tt{display:block;font-weight:700;font-size:1rem;line-height:1.35}
.tile .ts{display:block;width:52px;height:52px;margin:-6px -4px -6px 0;transform:rotate(var(--r,-7deg))}
.tile .ts svg{display:block;width:100%;height:auto}
.tile.now{background:var(--tf);outline:3px solid var(--ink);outline-offset:-3px}
.tile.now .tp{color:var(--ink)}

/* ============ Bibliotheksraum ============ */
.lib-text{margin-top:8px}
.lib-text .ph{font:700 1.1875rem/1.35 var(--f-text);margin:40px 0 8px;max-width:var(--read);text-wrap:balance}
.lib-text p{position:relative;max-width:var(--read);text-wrap:pretty}
.lib-text ul{max-width:var(--read);margin:10px 0 0 1.2em;display:grid;gap:6px}
.pn{display:inline-block;margin-right:.5em;font-size:var(--step-small);font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums}
@media (min-width:760px){.pn{position:absolute;left:-2.2em;top:.25em;width:1.6em;margin:0;text-align:right}}
.lib .notice{max-width:var(--read)}
.lib-video{max-width:var(--read);margin-top:40px}
.lib-video .lv-h{font:700 1.1875rem/1.35 var(--f-text);margin:0 0 8px;text-wrap:balance}
.lib-video .btn-row{margin:14px 0 18px}
.lib .notice.warn{margin-top:40px}

/* ============ Rätselraum ============ */
.room-screen{background:var(--surface)}
.room-screen .lede{margin-top:4px}
.part{margin-top:48px}
.part h2{font-size:1.9rem;margin-bottom:8px}
.prompt{font-weight:700;line-height:1.45;margin-bottom:16px}
.mark{display:none;align-items:center;gap:6px;font-size:var(--step-small);font-weight:700;line-height:1.3}
.mark svg{width:18px;height:18px}
.is-ok .mark{display:inline-flex;color:var(--ok)}
.is-bad .mark{display:inline-flex;color:var(--bad)}
/* Körbe */
.cards,.rows{list-style:none}
.cards{display:grid;gap:10px}
@media (min-width:900px){.cards{grid-template-columns:1fr 1fr;align-items:start}}
.bcard{display:grid;gap:10px;padding:14px 16px;background:var(--paper);align-content:start}
.bt{font-weight:600;line-height:1.45;overflow-wrap:anywhere}
.seg{display:grid;gap:8px}
@media (min-width:420px){.seg{grid-template-columns:1fr 1fr}}
.seg button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:8px 12px;border:3px solid var(--ink);border-radius:0;background:var(--paper);color:var(--ink);font:600 .95rem/1.25 var(--f-text);white-space:normal;overflow-wrap:anywhere;cursor:pointer;transition:transform 160ms var(--ease-out),background-color 150ms ease}
.seg button:active{transform:scale(.97)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#ffffff}
.seg .pick{display:none}
.seg .pick svg{width:18px;height:18px}
.seg button[aria-pressed="true"] .pick{display:inline-flex}
@media (hover:hover) and (pointer:fine){.seg button[aria-pressed="false"]:hover{background:var(--surface)}}

<script>
/* Videos erst nach Klick laden: YouTube-Rahmen tragen ihre Adresse in data-yt-src und zeigen bis zum Klick einen
   Hinweis (srcdoc). Erst „Video laden“ stellt eine Verbindung zu YouTube her (siehe Impressum & Datenschutz). Der Link
   ersetzt den Rahmen per location.replace – so entsteht kein Eintrag im Verlauf des Browsers. */
(function(){
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function prep(f){
    var u=f.getAttribute('data-yt-src');
    if(!u||f.hasAttribute('srcdoc')) return;
    var go=u+(u.indexOf('?')<0?'?':'&')+'autoplay=1';
    var t=f.getAttribute('title')||'';
    if(/^YouTube video player$/i.test(t)) t='';
    f.setAttribute('srcdoc','<!doctype html><html lang="de"><head><meta charset="utf-8"><style>'
      +'@font-face{font-family:"Work Sans";font-weight:400;src:url(fonts/work-sans-latin-400-normal.woff2) format("woff2")}'
      +'@font-face{font-family:"Work Sans";font-weight:700;src:url(fonts/work-sans-latin-700-normal.woff2) format("woff2")}'
      +'html,body{margin:0;height:100%}body{display:flex;align-items:center;justify-content:center;background:#121417;color:#ffffff;'
      +'font:14px/1.45 "Work Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}'
      +'.b{max-width:30em;padding:12px 16px}.t{font-weight:700;margin:0 0 10px}'
      +'a{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;min-height:44px;padding:9px 20px;border:3px solid #a7ff9c;border-radius:0;background:#a7ff9c;color:#121417;font-weight:700;text-decoration:none}'
      +'a:hover{background:#8ef182;border-color:#8ef182}a:focus-visible{outline:3px solid #ffffff;outline-offset:3px}p.n{margin:10px 0 0;font-size:13px;line-height:1.4;color:#e4e6e3}'
      +'@media (max-height:210px){.t{display:none}.b{padding:6px 12px}p.n{margin-top:6px;line-height:1.3}}</style></head><body><div class="b">'
      +(t?'<p class="t">'+esc(t)+'</p>':'')
      +'<a href="'+esc(go)+'" onclick="if(event.ctrlKey||event.metaKey||event.shiftKey||event.button)return true;location.replace(this.href);return false">&#9654; Video von YouTube laden</a>'
      +'<p class="n">Erst nach diesem Klick wird das Video von YouTube (Google) geladen. Dabei erhält Google unter anderem deine IP-Adresse und kann Cookies setzen; Daten können in die USA gelangen.</p>'
      +'</div></body></html>');
  }
  function scan(n){
    if(n.nodeType!==1) return;
    if(n.tagName==='IFRAME') prep(n);
    else if(n.querySelectorAll){ var l=n.querySelectorAll('iframe[data-yt-src]'); for(var i=0;i<l.length;i++) prep(l[i]); }
  }
  new MutationObserver(function(ms){ ms.forEach(function(m){ m.addedNodes.forEach(scan); }); })
    .observe(document.documentElement,{childList:true,subtree:true});
})();
</script>

function maskBirth(el,ev){
  const raw=el.value, caret=el.selectionStart==null?raw.length:el.selectionStart;
  const del=!!(ev&&/^delete/.test(ev.inputType||''));
  const g=['','','']; let k=0, out='', at=-1;
  for(let i=0;i<raw.length;i++){
    if(i===caret) at=out.length;
    const ch=raw[i];
    if(/[0-9]/.test(ch)){
      if(k<2 && g[k].length===2){ k++; out+='.'; }
      if(g[k].length===(k===2?4:2)) continue;
      g[k]+=ch; out+=ch;
    } else if(/[.,/\-\s]/.test(ch) && k<2 && g[k].length>0){ k++; out+='.'; }
  }
  if(!del && k<2 && g[k].length===2) out+='.';

}

    let cmd='';
    if(fill) cmd+=`${pdfNum(fill[0]/255)} ${pdfNum(fill[1]/255)} ${pdfNum(fill[2]/255)} rg\n`;
    if(stroke) cmd+=`${pdfNum(stroke[0]/255)} ${pdfNum(stroke[1]/255)} ${pdfNum(stroke[2]/255)} RG\n`;
    cmd+=`${pdfNum(x)} ${pdfNum(y)} ${pdfNum(w)} ${pdfNum(h)} re\n`;
    if(fill&&stroke) cmd+='B'; else if(fill) cmd+='f'; else if(stroke) cmd+='S';
    this.currentContent.push(cmd);
  }
  line(x1,y1,x2,y2,color,width){
    const c=color||[0,0,0];
    this.currentContent.push(`${pdfNum(c[0]/255)} ${pdfNum(c[1]/255)} ${pdfNum(c[2]/255)} RG\n${width||0.5} w\n${pdfNum(x1)} ${pdfNum(y1)} m ${pdfNum(x2)} ${pdfNum(y2)} l S`);
  }
  wrapLines(str,width,fontSize,isBold){
    const out=[]; let line='';
    for(const word of String(str).split(/\s+/)){
      if(!word) continue;
      const test=line?line+' '+word:word;
      if(pdfStringWidth(test,fontSize,isBold)<=width) line=test;
      else { if(line) out.push(line); line=word; }
    }
    if(line) out.push(line);
    return out;
  }
  // wie wrapLines, trennt aber zu lange Wörter (erst nach Bindestrichen, dann zwischen Buchstaben) – nichts ragt über width
  wrapLinesHard(str,width,fontSize,isBold){
    const out=[], fits=t=>pdfStringWidth(t,fontSize,isBold)<=width;
    for(const ln of this.wrapLines(str,width,fontSize,isBold)){
      if(fits(ln)){ out.push(ln); continue; }
      let cur='';
      for(const part of (ln.match(/[^-]*-|[^-]+$/g)||[ln])){   // nach jedem Bindestrich (ohne Lookbehind: ältere Safari)
        if(fits(cur+part)){ cur+=part; continue; }
        if(cur){ out.push(cur); cur=''; }
        if(fits(part)){ cur=part; continue; }
        for(const ch of part){ if(cur && !fits(cur+ch)){ out.push(cur); cur=''; } cur+=ch; }
      }
      if(cur) out.push(cur);
    }
    return out;
  }
  paragraph(str,x,y,width,fontSize,isBold,color,leading){
    if(!leading) leading=fontSize*1.4;
    let curY=y;
    for(const ln of this.wrapLines(str,width,fontSize,isBold)){ this.text(ln,x,curY,fontSize,isBold,color); curY-=leading; }
    return curY;
  }
  // wie paragraph, bricht aber auch mitten im Absatz auf eine neue Seite um (ensureFn liefert die neue y-Position)
  paragraphFlow(str,x,y,width,fontSize,isBold,color,leading,ensureFn){
    if(!leading) leading=fontSize*1.4;
    let curY=y;
    for(const ln of this.wrapLines(str,width,fontSize,isBold)){ curY=ensureFn(curY,leading); this.text(ln,x,curY,fontSize,isBold,color); curY-=leading; }
    return curY;
  }
  // opts: { embed: Uint8Array (Datensatz), link: {rect:[x1,y1,x2,y2], page:0, uri}, title }
  build(opts){
    opts=opts||{};
    const W=this.pageW, M=this.margin, FOOT=[74,79,87], N=this.pages.length;
    const objects=[null,null,
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'];
    const add=s=>{ objects.push(s); return objects.length; };
    const linkId=opts.link ? 4+2*N+1 : 0;
    const linkPage=opts.link ? (opts.link.page||0) : -1;
    const pageIds=[];
    this.pages.forEach((page,i)=>{
      const label='Seite '+(i+1)+' von '+N;
      const foot=this._textCmd('Copyright Jan-Rickmer Feindt',M,32,8.5,false,FOOT)+'\n'
        +this._textCmd(label,W-M-pdfStringWidth(label,8.5,false),32,8.5,false,FOOT);
      const content=page.content+'\n'+foot;
      const contentId=add(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
      pageIds.push(add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.pageW} ${this.pageH}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${contentId} 0 R${i===linkPage?` /Annots [${linkId} 0 R]`:''} >>`));
    });
    if(opts.link){
      const r=opts.link.rect.map(pdfNum).join(' ');
      add(`<< /Type /Annot /Subtype /Link /Rect [${r}] /Border [0 0 0] /A << /S /URI /URI ${this._escapedString(opts.link.uri)} >> >>`);
    }
    let specId=0;
    if(opts.embed){
      const bytes=opts.embed; let bin='';
      for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
      specId=objects.length+1; const fileId=specId+1;
      add(`<< /Type /Filespec /F (feibeitsblatt-escape.json) /UF (feibeitsblatt-escape.json) /Desc (Escape-Room FastFashion) /AFRelationship /Data /EF << /F ${fileId} 0 R /UF ${fileId} 0 R >> >>`);
      add(`<< /Type /EmbeddedFile /Subtype /application#2Fjson /FbEscape 1 /Params << /Size ${bytes.length} >> /Length ${bytes.length} >>\nstream\n${bin}\nendstream`);
    }
    const now=new Date(), two=n=>String(n).padStart(2,'0');
    const stamp='D:'+now.getFullYear()+two(now.getMonth()+1)+two(now.getDate())+two(now.getHours())+two(now.getMinutes())+two(now.getSeconds());
    let titleHex='FEFF'; for(const ch of String(opts.title||'')){ const c=ch.charCodeAt(0); titleHex+=c.toString(16).toUpperCase().padStart(4,'0'); }
    const infoId=add(`<< /Title <${titleHex}> /Producer (Escape-Room FastFashion) /CreationDate (${stamp}) >>`);
    objects[1]=`<< /Type /Pages /Kids [${pageIds.map(i=>i+' 0 R').join(' ')}] /Count ${pageIds.length} >>`;
    objects[0]=specId
      ? `<< /Type /Catalog /Pages 2 0 R /Names << /EmbeddedFiles << /Names [(feibeitsblatt-escape.json) ${specId} 0 R] >> >> /AF [${specId} 0 R] >>`
      : '<< /Type /Catalog /Pages 2 0 R >>';
    let pdf='%PDF-1.7\n%\xE2\xE3\xCF\xD3\n'; const offsets=[0];
    for(let i=0;i<objects.length;i++){ offsets.push(pdf.length); pdf+=`${i+1} 0 obj\n${objects[i]}\nendobj\n`; }
    const xrefOffset=pdf.length;
    pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`;
    for(let i=1;i<=objects.length;i++) pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
    pdf+=`trailer\n<< /Size ${objects.length+1} /Root 1 0 R /Info ${infoId} 0 R >>\nstartxref\n${xrefOffset}\n%%EOF\n`;
    return pdf;
  }
}

/* ============================================================
   Überblick-PDF — „Überblick deiner Antworten & Erläuterungen“ (Lösungserläuterungen ab neuer Seite)
   ============================================================ */
function fmtDateTime(d){
  if(!d) d=new Date();
  d=new Date(d);
  const date=d.toLocaleDateString('de-DE');
  const time=d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  return date+', '+time+' Uhr';
}
function firstTryStats(){
  const totalErrors=state.mistakes.reduce((a,m)=>a+(m&&m.errors?m.errors.length:0),0);
  const perfect=state.attempts.filter((a,i)=>a>=1 && (!state.mistakes[i]||!state.mistakes[i].errors||state.mistakes[i].errors.length===0)).length;
  return { totalErrors, perfect };
}

function generateOverviewPdf(){
  const doc=new PdfDoc();

  const HEAD=[18,20,23], HEAD_SUB=[200,205,212], ORANGE_BG=[255,233,214], ORANGE=[194,65,12], ORANGE_TXT=[140,45,8],

    : 'Hinweis: Als diese PDF entstand, war das Finale im Feiditor-Feibeitsblatt (Adresse unten) noch nicht freigeschaltet – mit dieser Datei lässt es sich nicht fortsetzen. Lade deine Zwischenstand-Datei im Escape-Room, sobald das Finale freigeschaltet ist, und geh durch den Arena-Tunnel.';
  const ADDR=FEIBEITSBLATT_URL;

  const boxH=16+n1*13.5+4+n2*12+4+12;
  doc.rect(M,y-boxH,CW,boxH,ORANGE_BG);
  doc.rect(M,y-boxH,3,boxH,ORANGE);
  let yb=doc.paragraph(NOTE1,M+12,y-16,CW-24,10.5,true,ORANGE_TXT,13.5);
  yb=doc.paragraph(NOTE2,M+12,yb-4,CW-24,9,false,MUTE,12);
  const ay=yb-4, aw=pdfStringWidth(ADDR,10,true);
  doc.text(ADDR,M+12,ay,10,true,ORANGE_TXT);

  const link={ rect:[M+11,ay-3,M+12+aw+2,ay+10], page:0, uri:ADDR };
  y-=boxH+14;

  // Identifikationsblock: Der Name bleibt in der linken Spalte (bis 280 pt) – erst kleiner, notfalls in zwei Zeilen, nie über

  const nameStr=state.firstName+' '+state.lastName, NAME_W=280;

  while(nameSize>10 && pdfStringWidth(nameStr,nameSize,true)>NAME_W) nameSize-=0.5;

  const nameLead=nameSize+2, extra=(nameLines.length-1)*nameLead;

  doc.rect(M,y-blockH,CW,blockH,ID_BG);
  doc.rect(M,y-blockH,3,blockH,INK);
  doc.text('NAME',M+14,y-16,8,true,ORANGE);
  nameLines.forEach((ln,i)=>doc.text(ln,M+14,y-31-i*nameLead,nameSize,true,INK));
  doc.text('GEBURTSDATUM',M+14,y-49-extra,8,true,ORANGE);
  doc.text(state.birthDate,M+14,y-63-extra,11,false,INK);
  doc.text('KLASSE',M+14,y-81-extra,8,true,ORANGE);
  doc.text(state.klasse,M+14,y-95-extra,11,false,INK);

  doc.text(state.code,M+300,y-31,13,true,INK);

  doc.text(fmtDateTime(state.completedAt),M+300,y-63,11,false,INK);

  y=doc.paragraph('Dieses Dokument fasst zusammen, welche Antworten du in jeder Station beim ersten Versuch gegeben hast. Du hast jede Station am Ende erfolgreich gelöst – diese Übersicht zeigt nur, wo es anfangs noch hakte. Auf den folgenden Seiten findest du ausführliche Lösungserläuterungen.',
    M,y,CW,10.5,false,INK,14);

  let sumSize=10.5; while(sumSize>8 && pdfStringWidth(sumLine,sumSize,true)>CW-24) sumSize-=0.5;
  doc.rect(M,y-34,CW,34,GREEN_BG);
  doc.rect(M,y-34,3,34,GREEN);
  doc.text('ÜBERSICHT',M+14,y-13,8,true,GREEN);
  doc.text(sumLine,M+14,y-26,sumSize,true,INK);
  y-=48;

  for(let i=0;i<6;i++){
    y=ensure(y,64);
    doc.text(ROOM_LABELS[i],M,y,12.5,true,stCol(i));
    doc.line(M,y-4,M+CW,y-4,stCol(i),0.8);

    }

    for(const err of m.errors){
      y=ensure(y,52);
      doc.text('•',M,y,11,true,RED);
      y=doc.paragraphFlow(err.item,M+14,y,CW-14,10.5,true,INK,13,ensure);
      if(err.wrong) y=doc.paragraphFlow('Deine Antwort: '+err.wrong,M+14,y,CW-14,10,false,RED,13,ensure);
      if(err.right) y=doc.paragraphFlow('Richtig: '+err.right,M+14,y,CW-14,10,true,GREEN,13,ensure);
      y-=5;
    }
    y-=10;
  }

  y=ensure(y,40);
  doc.line(M,y,M+CW,y,[200,205,212],0.4); y-=14;
  doc.text('Bestätigungscode: '+state.code,M,y,10,true,INK);
  doc.endPage();

  /* ---- Lösungserläuterungen ---- */
  function ensure2(y,need){ if(y-need<70){ doc.endPage(); return header(T2); } return y; }
  let y2=header(T2);
  y2=doc.paragraph('Hier werden die richtigen Lösungen der sechs Stationen noch einmal genauer erklärt. Nutze diese Seiten, um das Thema zu wiederholen – und für Kayas Dossier im Finale.',M,y2,CW,10.5,false,INK,14);
  y2-=10;
  SOLUTION_NOTES.forEach((note,i)=>{
    y2=ensure2(y2,90);
    doc.text(note.room,M,y2,12.5,true,stCol(i));
    doc.line(M,y2-4,M+CW,y2-4,stCol(i),0.8);
    y2-=18;
    y2=doc.paragraphFlow(note.text,M,y2,CW,10.5,false,INK,14.5,ensure2);
    y2-=4;
    y2=doc.paragraphFlow(note.data,M,y2,CW,9,false,MUTE,12.5,ensure2);
    y2-=14;
  });
  // Vermerk: Wurde eine Zwischenstand-Datei geladen – und wo ging es weiter?
  y2=ensure2(y2,60);
  doc.text('Verwendung von Zwischenstand-Dateien',M,y2,12.5,true,INK);
  doc.line(M,y2-4,M+CW,y2-4,INK,0.8);
  y2-=18;
  for(const line of saveLogPdfLines()){ y2=doc.paragraphFlow(line,M,y2,CW,10.5,false,INK,14.5,ensure2); y2-=2; }
  doc.endPage();

  const embed=new TextEncoder().encode(JSON.stringify(buildEscapeRecord()));
  return doc.build({ embed, link, title:'Überblick Escape-Room FastFashion' });
}

/* ============================================================
   DATENSATZ FÜR DAS FEIDITOR-FEIBEITSBLATT (Schnittstelle v1)
   ============================================================ */
function fbEscapeHash(str){ // cyrb53-Variante wie saveHash, 64 Bit als 16 Hex-Zeichen
  let h1=0xdeadbeef^str.length, h2=0x41c6ce57^str.length;
  for(let i=0;i<str.length;i++){ const ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0');
}
function cleanLine(s, max){ return String(s == null ? '' : s).normalize('NFC').replace(/[\u0000-\u001F\u007F]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, max); }
function cleanText(s, max){ return String(s == null ? '' : s).normalize('NFC').replace(/\r\n?/g, '\n').replace(/[\u0000-\u0009\u000B-\u001F\u007F]+/g, ' ').slice(0, max); }
function buildEscapeRecord(){
  const iso = d => { const x = new Date(d); return isNaN(x) ? '' : x.toISOString(); };
  const data = {
    code: FB_CODE,
    room: { id: ESCAPE_ROOM.id, name: ESCAPE_ROOM.name, url: ESCAPE_ROOM.url },
    person: { vorname: cleanLine(state.firstName, 60), nachname: cleanLine(state.lastName, 60),
              geburtsdatum: state.birthDate, klasse: state.klasse },
    confirm: String(state.code),
    word: CODE_WORD,
    completedAt: iso(state.completedAt || new Date()),
    stations: STATIONS.map((s, i) => ({ label: s.label, attempts: state.attempts[i],
      errors: ((state.mistakes[i] && state.mistakes[i].errors) || []).slice(0, 30).map(e => {
        const o = { item: cleanLine(e.item, 2000) };
        if (e.wrong) o.wrong = cleanLine(e.wrong, 2000);
        if (e.right) o.right = cleanLine(e.right, 2000);
        if (e.note)  o.note  = cleanLine(e.note, 2000);
        return o; }) })),
    notes: SOLUTION_NOTES.map(n => ({ label: n.room, text: cleanText(n.text + '\n\n' + n.data, 4000) })),
    resumes: (state.resumeLog || []).slice(-20).map(r => ({ place: cleanLine(r.place, 2000), savedAt: iso(r.savedAt), loadedAt: iso(r.loadedAt) })),
  };
  const d = JSON.stringify(data);
  return { kind: 'feibeitsblatt-escape', v: 1, d, s: fbEscapeHash('FbEscape|v1|' + d) };
}
function b64url(str){
  const bytes = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

/* ============================================================
   DOWNLOAD DER ÜBERBLICK-PDF
   ============================================================ */
function overviewFileName(){
  const d=new Date(), two=n=>String(n).padStart(2,'0');
  return `Ueberblick-Escape-Room-FastFashion-${two(d.getDate())}-${two(d.getMonth()+1)}-${d.getFullYear()}.pdf`;
}
window.downloadOverviewPDF=()=>{
  try{
    const bin=generateOverviewPdf();
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i)&0xFF;
    // application/octet-stream statt application/pdf: Der Browser SPEICHERT die Datei, statt sie anzuzeigen.
    const blob=new Blob([bytes],{type:'application/octet-stream'});
    const url=URL.createObjectURL(blob);
    // Unsichtbarer Link, synchron im Klick-Handler ausgelöst – kein window.open, kein neuer Tab.
    const link=document.createElement('a');
    link.href=url; link.download=overviewFileName(); link.style.display='none';
    document.body.appendChild(link);
    link.click();
    // Object-URL lange gültig lassen: iOS liest den Blob erst, wenn der Download-Dialog bestätigt ist.
    setTimeout(()=>{ try{ document.body.removeChild(link); }catch(_){} URL.revokeObjectURL(url); },60000);
    state.pdfDownloaded=true;
    return true;
  }catch(e){ console.error(e); return false; }
};

function enterTunnel(force){
  if (!FB_CODE) { const lk=document.getElementById('gateLocked'); if(lk) lk.focus(); return; }
  if (!state.pdfDownloaded && !force) { document.getElementById('tunnelDialog').showModal(); return; }
  const msg=document.getElementById('gateMsg'); if(msg){ msg.textContent=''; msg.className='msg'; }
  try{
    const url=FB_URL + '#escape=' + b64url(JSON.stringify(buildEscapeRecord()));
    leaving=true;
    location.assign(url);
  }catch(e){
    leaving=false; console.error(e);
    if(msg){ msg.className='msg is-err'; msg.textContent='Der Tunnel konnte nicht geöffnet werden. Lade die Seite nicht neu – versuche es noch einmal.'; }
  }
}

/* ============================================================
   GLOBUS, ROUTENKARTE, STEMPEL (inline-SVG, ohne Bibliothek)
   ============================================================ */
const D2R=Math.PI/180, GA=Math.PI*(3-Math.sqrt(5));
// Landpunkte einmal dekodieren: [Breite, Länge] im Bogenmaß
const LAND=(()=>{ const b=atob(GLOBE_LAND); const out=[];
  for(let i=0;i<GLOBE_N;i++){ if((b.charCodeAt(i>>3)>>(i&7))&1){ const z=1-(2*i+1)/GLOBE_N; let lon=(i*GA)%(2*Math.PI); if(lon>Math.PI) lon-=2*Math.PI; out.push([Math.asin(z),lon]); } }
  return out; })();
const SVGNS='http://www.w3.org/2000/svg';
const GLOBE_COL={ sea:'#121417', l1:'#c9ced6', l2:'#8d949e', l3:'#5b616b' };
const ll=p=>[p.lat*D2R,p.lon*D2R];
function gproj(lat,lon,c,k){
  const dl=lon-c[1], sl=Math.sin(lat), cl=Math.cos(lat), cd=Math.cos(dl);
  const cosc=Math.sin(c[0])*sl+Math.cos(c[0])*cl*cd; k=k||1;
  return { x:200+180*k*cl*Math.sin(dl), y:200-180*k*(Math.cos(c[0])*sl-Math.sin(c[0])*cl*cd), v:cosc };
}

// opt: { idx (Station für Hervorhebung/Pins), arc:{a,b,t}, pins:true|false, pinAnim }
function drawGlobe(svg,center,opt){
  opt=opt||{};
  const g=globeParts(svg);
  const hl=opt.idx!=null ? highlightSet(opt.idx) : null;
  const bands=[[],[],[]], hls=[];
  for(let i=0;i<LAND.length;i++){
    const p=LAND[i], q=gproj(p[0],p[1],center);
    if(q.v<=0) continue;
    const s='M'+q.x.toFixed(1)+' '+q.y.toFixed(1)+'h0';
    if(hl && hl[i]) hls.push(s);
    else bands[q.v>0.55?0:q.v>0.25?1:2].push(s);
  }
  g.b1.setAttribute('d',bands[0].join('')); g.b2.setAttribute('d',bands[1].join('')); g.b3.setAttribute('d',bands[2].join(''));
  g.hl.setAttribute('d',hls.join(''));
  if(opt.idx!=null) g.hl.setAttribute('stroke',CONT[STATIONS[opt.idx].cont].field);
  // Flugbogen (Großkreis, leicht angehoben), wächst bis zum Anteil t; Startpunkt = Pin der vorigen Station, Spitze = Flugzeug
  let d='', headAt=null, fromAt=null;
  if(opt.arc){
    const f=gproj(opt.arc.a[0],opt.arc.a[1],center);
    if(f.v>0) fromAt=f;
    const a=opt.arc.a, b=opt.arc.b, tt=opt.arc.t==null?1:opt.arc.t, dist=gdist(a,b);
    if(dist>1e-6 && tt>0){
      let pen=false;
      for(let i=0;i<=48;i++){
        let t=i/48; if(t>tt) t=tt;
        const A=Math.sin((1-t)*dist)/Math.sin(dist), B=Math.sin(t*dist)/Math.sin(dist);
        const x=A*Math.cos(a[0])*Math.cos(a[1])+B*Math.cos(b[0])*Math.cos(b[1]);
        const y=A*Math.cos(a[0])*Math.sin(a[1])+B*Math.cos(b[0])*Math.sin(b[1]);
        const z=A*Math.sin(a[0])+B*Math.sin(b[0]);
        const lat=Math.atan2(z,Math.hypot(x,y)), lon=Math.atan2(y,x);
        const ground=gproj(lat,lon,center), q=gproj(lat,lon,center,1+0.16*Math.sin(Math.PI*t));

        else { d+=(pen?'L':'M')+q.x.toFixed(1)+' '+q.y.toFixed(1); pen=true; headAt=q; }
        if(t>=tt) break;
      }
      if(tt>=1) headAt=null;
    }
  }
  g.arc.setAttribute('d',d);
  if(fromAt && opt.arc.col){ g.from.setAttribute('cx',fromAt.x.toFixed(1)); g.from.setAttribute('cy',fromAt.y.toFixed(1)); g.from.setAttribute('fill',opt.arc.col); g.from.setAttribute('visibility','visible'); }
  else g.from.setAttribute('visibility','hidden');
  if(headAt){ g.head.setAttribute('cx',headAt.x.toFixed(1)); g.head.setAttribute('cy',headAt.y.toFixed(1)); g.head.setAttribute('visibility','visible'); }
  else g.head.setAttribute('visibility','hidden');
  // Pins mit Beschriftung
  g.pins.textContent='';
  if(opt.pins && opt.idx!=null){
    const st=STATIONS[opt.idx];
    st.pins.forEach(pp=>{
      const q=gproj(pp.lat*D2R,pp.lon*D2R,center); if(q.v<=0) return;
      const grp=g.mk('g',{class:opt.pinAnim?'pin pin-in':'pin'},g.pins);
      g.mk('circle',{cx:q.x.toFixed(1),cy:q.y.toFixed(1),r:9,fill:CONT[st.cont].field,stroke:GLOBE_COL.sea,'stroke-width':3},grp);
      const right=pp.side!=='left';
      const t=g.mk('text',{x:(q.x+(right?14:-14)).toFixed(1),y:(q.y+5).toFixed(1),'text-anchor':right?'start':'end',fill:'#ffffff',stroke:GLOBE_COL.sea,'stroke-width':4,'paint-order':'stroke','stroke-linejoin':'round','font-family':"'Work Sans', sans-serif",'font-weight':'700','font-size':'15'},grp);
      t.textContent=pp.name;
    });
  }
}
const easeInOutQuart=t=>t<.5?8*t*t*t*t:1-Math.pow(-2*t+2,4)/2;
// Dreht den Globus von a nach b (je [Breite, Länge] im Bogenmaß); frame(center, e, t) zeichnet jedes Bild
function spinGlobe(svg,a,b,ms,frame,done){
  const dl=((b[1]-a[1]+3*Math.PI)%(2*Math.PI))-Math.PI;
  const at=e=>[a[0]+(b[0]-a[0])*e, a[1]+dl*e];
  if(reducedMotion()||ms<=0){ frame(b,1,1); if(done) done(); return; }
  const t0=performance.now();
  frame(a,0,0);
  function step(now){
    if(!svg.isConnected) return;
    const t=Math.min(1,(now-t0)/ms), e=easeInOutQuart(t);
    frame(at(e),e,t);
    if(t<1) requestAnimationFrame(step); else if(done) done();
  }

}

// Flache Routenkarte (Equal-Earth-Projektion derselben Landpunkte)
function eqEarth(lat,lon){
  const A1=1.340264, A2=-0.081106, A3=0.000893, A4=0.003796, M=Math.sqrt(3)/2;

  return [500+X*s, 250-Y*s];
}

function submitStart(){
  const ids=['firstNameInput','lastNameInput','birthInput','klasseInput'], el=ids.map(id=>document.getElementById(id));
  const err=document.getElementById('startError');
  el.forEach(x=>{ x.removeAttribute('aria-invalid'); x.removeAttribute('aria-describedby'); });
  err.textContent='';
  const fail=(x,msg)=>{ err.textContent=msg; x.setAttribute('aria-invalid','true'); x.setAttribute('aria-describedby','startError'); x.focus(); };
  const fn=cleanInput(el[0].value), ln=cleanInput(el[1].value), bd=padBirth(cleanInput(el[2].value).replace(/\s/g,'')), kv=cleanInput(el[3].value);
  const nameOk=s=>s.length>=2 && /\p{L}/u.test(s);
  const NAME_MSG='Bitte trage deinen vollen Vor- und Nachnamen ein (jeweils mindestens 2 Zeichen).';
  const LATIN_MSG='Bitte schreibe deinen Vor- und Nachnamen mit lateinischen Buchstaben – so, wie er in deinem Zeugnis steht.';
  if(!nameOk(fn)) return fail(el[0],NAME_MSG);
  if(!nameOk(ln)) return fail(el[1],NAME_MSG);
  if(!pdfPrintable(fn)) return fail(el[0],LATIN_MSG);
  if(!pdfPrintable(ln)) return fail(el[1],LATIN_MSG);
  if(el[2].value!==bd && /^\d{2}\.\d{2}\.\d{4}$/.test(bd)) el[2].value=bd;
  const m=/^(\d{2})\.(\d{2})\.(\d{4})$/.exec(bd);
  if(!m) return fail(el[2],'Bitte gib dein Geburtsdatum im Format TT.MM.JJJJ ein (z. B. 14.09.2010).');
  const dd=+m[1], mm=+m[2], yy=+m[3], dt=new Date(yy,mm-1,dd), now=new Date();
  if(dt.getFullYear()!==yy||dt.getMonth()!==mm-1||dt.getDate()!==dd||yy<1950||yy>now.getFullYear()||dt>now)
    return fail(el[2],'Das Geburtsdatum scheint nicht zu stimmen. Bitte prüfe Tag, Monat und Jahr.');
  const k=normKlasse(kv);
  if(!k) return fail(el[3],'Bitte gib deine Klasse ein (z. B. 10b).');
  if(!/^[\p{L}\p{N}/-]{1,10}$/u.test(k)) return fail(el[3],'Bitte gib deine Klasse nur mit Buchstaben und Ziffern ein (z. B. 10b).');
  if(!pdfPrintable(k)) return fail(el[3],'Bitte gib deine Klasse mit lateinischen Buchstaben und Ziffern ein (z. B. 10b).');
  state.firstName=fn; state.lastName=ln; state.birthDate=bd; state.klasse=k;
  state.code=computeCode(m[1]+m[2]+m[3]);
  renderIntro();
}

const PART_LETTERS=['A','B','C'];

function partHtml(p,pi){
  const X=PART_LETTERS[pi], pid='p'+p.id;

    rs.order[p.id]=shuffle(p.cards);

        <span class="mark" id="${pid}-${c.id}-m"></span>
      </li>`).join('')+'</ul>';
  } else if(p.type==='mc'){
    rs.order[p.id]=shuffle(p.options.map((o,k)=>k));
    body=`<fieldset class="mc" id="${pid}"><legend>${richText(p.question)}</legend><div class="opts">`
      +rs.order[p.id].map(k=>`<label class="opt" data-k="${k}"><input type="radio" name="${pid}" value="${k}"><span class="ot">${escapeHtml(p.options[k].t)}</span><span class="mark"></span></label>`).join('')
      +'</div></fieldset>';
  } else if(p.type==='assign'){
    rs.order[p.id]=shuffle(p.rows);
    const opts=shuffle(p.options.map((o,k)=>k));   // eine Reihenfolge für alle Auswahllisten des Teils
    body='<ul class="rows" role="list">'+rs.order[p.id].map(r=>`
      <li class="row" id="${pid}-${r.id}" data-part="${p.id}" data-row="${r.id}">
        <label for="${pid}-${r.id}-s">${escapeHtml(r.text)}</label>
        <select class="sel" id="${pid}-${r.id}-s" aria-describedby="${pid}-${r.id}-m"><option value="">${escapeHtml(p.placeholder)}</option>${opts.map(k=>`<option value="${k}">${escapeHtml(p.options[k])}</option>`).join('')}</select>
        <p class="echo" aria-hidden="true"></p>
        <span class="mark" id="${pid}-${r.id}-m"></span>
      </li>`).join('')+'</ul>';
  } else if(p.type==='cloze'){
    let k=0; const n=p.blanks.length, desc=[];
    body=`<p class="cloze">`+p.segments.map(s=>{
      if(typeof s==='string') return escapeHtml(s);
      const b=p.blanks.find(x=>x.id===s.blank); k++;
      desc.push(`<span id="${pid}-${b.id}-d">${escapeHtml(b.sentence.replace(/_{2,}/g,'(Lücke)'))}</span>`);
      return `<span class="gapno" aria-hidden="true">${k}</span><input class="gap${b.kind==='number'?' num':''}" id="${pid}-${b.id}" type="text"${b.kind==='number'?' inputmode="decimal"':''} aria-label="Lücke ${k} von ${n}" aria-describedby="${pid}-${b.id}-d" enterkeyhint="next" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="40"><span class="gmark" id="${pid}-${b.id}-m"></span>`;
    }).join('')+`</p><div hidden>${desc.join('')}</div><p class="info" id="${pid}-info" role="status"></p>`;
  } else if(p.type==='number'){
    body=`<div class="numq"><label for="${pid}-in">${escapeHtml(p.question)}</label><div class="numrow">`
      +`<input class="gap numin" id="${pid}-in" type="text" inputmode="decimal" enterkeyhint="next" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="40">`
      +`<span class="unit">${escapeHtml(p.unit)}</span><span class="gmark" id="${pid}-in-m"></span></div></div>`;
  } else if(p.type==='keystone'){
    body=`<div class="keystone"><label for="${pid}-in">${escapeHtml(p.question)}</label><div class="krow">`
      +`<input class="kin" id="${pid}-in" type="text" enterkeyhint="next" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="40">`
      +`<span class="kmark" id="${pid}-in-m"></span></div></div>`;
  }
  return `<section class="part" id="${pid}-part" aria-labelledby="${pid}-h"><h2 id="${pid}-h">Teil ${X}</h2><p class="prompt">${escapeHtml(promptText(p))}</p>${body}</section>`;
}

function clearMark(el){

}
function setMark(el,ok){
  el.classList.toggle('is-ok',ok); el.classList.toggle('is-bad',!ok);
  const m=el.querySelector(':scope > .mark'); if(m) m.innerHTML=ok?I.check+'<span>Richtig</span>':I.cross+'<span>Stimmt noch nicht</span>';
  const sel=el.querySelector(':scope > select'); if(sel){ if(ok) sel.removeAttribute('aria-invalid'); else sel.setAttribute('aria-invalid','true'); }
}
function setFieldMark(input,ok){
  input.classList.toggle('is-ok',ok); input.classList.toggle('is-bad',!ok);
  if(ok) input.removeAttribute('aria-invalid'); else input.setAttribute('aria-invalid','true');
  const m=document.getElementById(input.id+'-m'); if(!m) return;
  if(m.classList.contains('kmark')){ m.className='kmark '+(ok?'ok':'bad'); m.innerHTML=(ok?I.check+'<span>Richtig</span>':I.cross+'<span>Stimmt noch nicht</span>'); }
  else { m.className='gmark '+(ok?'ok':'bad'); m.innerHTML=(ok?I.check:I.cross)+`<span class="sr-only">${ok?'richtig':'stimmt noch nicht'}</span>`; }
}
function clearFieldMark(input){

function growField(el){
  const base=el.classList.contains('kin')?8:el.classList.contains('numin')?10:el.classList.contains('num')?6:14;
  const len=[...el.value].length+3;

const freeFields=box=>[...box.querySelectorAll('.part .gap, .part .kin')];
// Tastatur auf Telefon/Tablet: „Weiter“, solange noch ein anderes Feld leer ist, sonst „Fertig“
function setEnterHint(box,el){
  const other=freeFields(box).some(x=>x!==el && x.value.trim()==='');

function bindRoom(idx){
  const st=STATIONS[idx], box=root.querySelector('.room-screen');
  box.addEventListener('click',e=>{
    const btn=e.target.closest('.seg button'); if(!btn||rs.submitted||btn.disabled) return;
    if(e.detail>1) return;   // zweiter Klick eines Doppelklicks wählt nichts um
    const card=btn.closest('.bcard'), pidd=card.dataset.part;
    (rs.choice[pidd]=rs.choice[pidd]||{})[card.dataset.card]=btn.dataset.b;
    card.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b===btn?'true':'false'));
    clearMark(card);
  });
  box.addEventListener('change',e=>{
    const t=e.target;

    else if(t.matches('select.sel')){
      const row=t.closest('.row'), part=st.parts.find(p=>p.id===row.dataset.part);
      row.querySelector('.echo').textContent=t.value===''?'':part.options[+t.value];
      clearMark(row);
    }
  });
  box.addEventListener('input',e=>{ if(e.target.matches('.gap,.kin')){ clearFieldMark(e.target); growField(e.target); } });
  box.addEventListener('focusin',e=>{ if(e.target.matches('.gap,.kin')) setEnterHint(box,e.target); });
  // Enter in einem Feld prüft – sind noch Felder leer, geht es dorthin (kein Versuch); eine gehaltene Taste zählt nur einmal
  box.addEventListener('keydown',e=>{
    if(e.key!=='Enter' || !e.target.matches('.gap,.kin')) return;
    e.preventDefault();
    if(e.repeat || e.isComposing) return;
    checkRoom(idx,{enter:e.target});
  });
  const cb=document.getElementById('checkBtn'); let ptr='';
  cb.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ') && e.repeat) e.preventDefault(); });
  cb.addEventListener('pointerdown',e=>{ ptr=e.pointerType||''; });
  cb.addEventListener('click',e=>{ if(e.detail>1) return; checkRoom(idx,{touch:ptr==='touch'}); ptr=''; });
}
function statusHtml(ok,msg){ return (ok?I.check:I.warn)+'<span>'+escapeHtml(msg)+'</span>'; }
function setStatus(ok,msg){
  const s=document.getElementById('statusBox');

  s.innerHTML=statusHtml(ok,msg);
}
function joinLetters(ls){ return ls.length===1?ls[0]:ls.slice(0,-1).join(', ')+' und '+ls[ls.length-1]; }
// Stand aller Eingaben (für den Schutz vor einem Doppeltipp auf „Prüfen“)
function roomFingerprint(scr){
  return [...scr.querySelectorAll('.part input, .part select')].map(x=>x.type==='radio'?(x.checked?'1':'0'):x.value).join('\u0001')+'\u0002'+JSON.stringify(rs.choice);
}
// opts.enter: ausgelöst mit Enter in diesem Feld · opts.touch: Fingertipp auf „Prüfen“
function checkRoom(idx,opts){
  opts=opts||{};
  if(!rs||rs.idx!==idx||rs.submitted) return;
  const st=STATIONS[idx], scr=root.querySelector('.room-screen');
  const fp=roomFingerprint(scr);
  if(opts.touch && fp===rs.lastFp && performance.now()-rs.lastAt<700) return;   // Doppeltipp: derselbe Stand zählt nicht zweimal
  // 1. Vollständigkeit (Auswahl-Bausteine; mit Enter auch leere Felder): kein Versuch, keine Markierung
  const missing=[], empty=[]; let missN=0;
  st.parts.forEach((p,pi)=>{
    const pid='p'+p.id; let miss=0;
    if(p.type==='baskets') miss=p.cards.filter(c=>!(rs.choice[p.id]&&rs.choice[p.id][c.id])).length;
    else if(p.type==='mc') miss=scr.querySelector(`input[name="${pid}"]:checked`)?0:1;
    else if(p.type==='assign') miss=p.rows.filter(r=>document.getElementById(`${pid}-${r.id}-s`).value==='').length;
    else if(opts.enter){ const em=freeFields(document.getElementById(pid+'-part')).filter(x=>x.value.trim()===''); miss=em.length; empty.push(...em); }
    if(miss){ missing.push(PART_LETTERS[pi]); missN+=miss; }
  });
  if(missing.length){
    setStatus(false,`Noch unvollständig: In Teil ${joinLetters(missing)} ${missN===1?'fehlt noch eine Antwort':'fehlen noch '+missN+' Antworten'}.`);
    if(opts.enter && empty.length){
      const all=freeFields(scr), pos=all.indexOf(opts.enter);
      const next=empty.find(x=>all.indexOf(x)>pos)||empty[0];
      if(next!==opts.enter) next.focus();
    }
    return;
  }
  // 2. Bewerten
  const errors=[], helps=[]; let n=0, akkord=null;
  const topicLine=(p,q)=>`Absatz ${p} – ${st.topics[p-1]}: ${q}`;
  st.parts.forEach((p,pi)=>{
    const X=PART_LETTERS[pi], pid='p'+p.id;
    if(p.type==='baskets'){
      rs.order[p.id].forEach(c=>{            // Reihenfolge wie angezeigt (Hilfe und Fehlerliste)
        n++; const chosen=rs.choice[p.id][c.id], ok=chosen===c.b, el=document.getElementById(`${pid}-${c.id}`);
        setMark(el,ok);
        if(!ok){
          const right=p.baskets.find(b=>b.id===c.b), wrong=p.baskets.find(b=>b.id===chosen);
          errors.push({kind:'korb', item:c.text, wrong:wrong?wrong.label:'', right:right.label});
          helps.push({name:'Karte '+quoted(c.text), s1:topicLine(c.p,c.q), s2:`Der richtige Korb beginnt mit ${quotedStart(right.start)}.`, s3:'Lösung: '+right.label});
        }
      });
    } else if(p.type==='mc'){
      n++; const inp=scr.querySelector(`input[name="${pid}"]:checked`), k=+inp.value, ok=!!p.options[k].ok;
      scr.querySelectorAll(`#${pid} .opt`).forEach(clearMark);
      setMark(inp.closest('.opt'),ok);
      if(!ok){
        const right=p.options.find(o=>o.ok);
        errors.push({kind:'mc', item:p.question, wrong:p.options[k].t, right:right.t});
        helps.push({name:'Teil '+X, s1:topicLine(p.p,p.q), s2:`Die richtige Antwort beginnt mit ${quotedStart(p.start)}.`, s3:'Lösung: '+p.sol});
      }
    } else if(p.type==='assign'){
      rs.order[p.id].forEach(r=>{
        n++; const sel=document.getElementById(`${pid}-${r.id}-s`), val=p.options[+sel.value], ok=val===r.ans;
        setMark(document.getElementById(`${pid}-${r.id}`),ok);
        if(!ok){
          const words=r.text.split(/\s+/), short=words.length<=6?quoted(r.text):quotedStart(words.slice(0,6).join(' ')+' …');
          errors.push({kind:'zuordnung', item:r.text, wrong:val, right:r.ans});
          helps.push({name:'Zeile '+short, s1:topicLine(r.p,r.q), s2:`Die richtige Antwort beginnt mit ${quotedStart(r.start)}.`, s3:'Lösung: '+r.ans});
        }
      });
    } else if(p.type==='cloze'){
      let k=0; const info=document.getElementById(pid+'-info'); info.textContent='';
      p.segments.forEach(s=>{
        if(typeof s==='string') return;
        const b=p.blanks.find(x=>x.id===s.blank); k++; n++;
        const inp=document.getElementById(`${pid}-${b.id}`), raw=inp.value;
        let ok=b.kind==='number'?numberMatches(raw,b.num):wordMatches(raw,b.accept);
        if(!ok && b.alsoOk && wordMatches(raw,b.alsoOk)){ ok=true; akkord=b.alsoOkNote; info.textContent=b.alsoOkNote; }
        setFieldMark(inp,ok);
        if(!ok){
          errors.push({kind:'luecke', item:`Lücke ${k}: ${b.sentence}`, wrong:raw.trim().slice(0,200)||'(leer)', right:b.sol});
          helps.push({name:'Lücke '+k, s1:topicLine(b.p,b.q), s2:b.h2, s3:'Lösung: '+b.sol});
        }
      });
    } else if(p.type==='number'){
      n++; const inp=document.getElementById(pid+'-in'), ok=numberMatches(inp.value,p.num);
      setFieldMark(inp,ok);
      if(!ok){
        errors.push({kind:'zahl', item:p.question, wrong:inp.value.trim().slice(0,200)||'(leer)', right:p.sol});
        helps.push({name:'Teil '+X, s1:topicLine(p.p,p.q), s2:p.h2, s3:'Lösung: '+p.sol});
      }
    } else if(p.type==='keystone'){
      n++; const inp=document.getElementById(pid+'-in'), ok=wordMatches(inp.value,p.accept);
      setFieldMark(inp,ok);
      if(!ok){
        errors.push({kind:'schlussstein', item:'Schlussstein: '+p.question, wrong:inp.value.trim().slice(0,200)||'(leer)', right:CODE_WORD});
        helps.push({name:'Schlussstein', s1:p.h1, s2:p.h2, s3:'Lösung: '+p.sol});
      }
    }
  });
  recordAttempt(idx,errors);
  rs.lastFp=fp; rs.lastAt=performance.now();
  const help=document.getElementById('helpBox');
  if(errors.length===0){
    rs.submitted=true;
    // Liegt der Fokus auf etwas, das jetzt gesperrt wird, wandert er zur Erfolgsmeldung (statt ins Leere)
    const ae=document.activeElement, lose=!!(ae && (ae.id==='checkBtn' || (ae.closest('.part') && !ae.matches('input[type="text"]'))));
    scr.querySelectorAll('.part button, .part input, .part select').forEach(el=>{ if(el.matches('input[type="text"]')) el.readOnly=true; else el.disabled=true; });
    help.hidden=true; help.innerHTML='';
    setStatus(true,'Richtig! '+st.success+(akkord?' '+akkord:''));
    if(lose) document.getElementById('statusBox').focus({preventScroll:true});
    document.getElementById('checkBtn').disabled=true;
    setTimeout(()=>{ if(rs&&rs.idx===idx&&state.screen==='room'+(idx+1)) triggerReveal(idx); },700);
    return;
  }
  setStatus(false,errors.length===1
    ? `Noch nicht ganz: 1 von ${n} Antworten stimmt noch nicht. Sie ist rot markiert – unten steht Hilfe.`
    : `Noch nicht ganz: ${errors.length} von ${n} Antworten stimmen noch nicht. Sie sind rot markiert – unten steht Hilfe.`);
  const stage=Math.min(state.attempts[idx],3);
  const heads=['Hilfe – Stufe 1 von 3: Wo stand es?','Hilfe – Stufe 2 von 3: Der Anfang','Hilfe – Stufe 3 von 3: Die Lösung'];
  help.innerHTML=`<div class="help-head">${I.bulb}<h3>${heads[stage-1]}</h3></div><ul>`
    +helps.map(h=>`<li><strong>${escapeHtml(h.name)}:</strong> ${escapeHtml(stage===1?h.s1:stage===2?h.s2:h.s3)}</li>`).join('')+'</ul>'
    +(stage===3?'<p>Trage die Lösungen ein und prüfe noch einmal.</p>':'');
  help.hidden=false;
  help.classList.remove('pop'); void help.offsetWidth; if(!reducedMotion()) help.classList.add('pop');
}

      <div class="btn-row"><button type="button" class="btn ghost" id="backToStart">Zurück zur Anmeldung</button></div>
    </div>
  </div></div>`);
  on('backToStart','click',renderStart);
}

/* ============================================================
   ZWISCHENSTAND ALS DATEI SPEICHERN / AUS DATEI LADEN
   Die Datei (.txt) enthält oben einen lesbaren Hinweistext und
   darunter einen codierten Datenblock mit Prüfsumme. Veränderte,
   beschädigte oder fremde Dateien werden beim Laden abgelehnt.
   Jedes Laden wird in state.resumeLog vermerkt und erscheint am
   Ende der Überblick-PDF (für die Lehrkraft).
   ============================================================ */
const SAVE_FORMAT = 1;
const SAVE_SALT   = 'Zwischenstand|Escape-Room|v1';
const SAVE_BEGIN  = '-----BEGIN ZWISCHENSTAND-----';
const SAVE_END    = '-----END ZWISCHENSTAND-----';
const SAVE_ICON   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>';
const LOAD_ICON   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>';

function saveHash(str){ // cyrb53-Variante, 64 Bit als 16 Hex-Zeichen
  let h1=0xdeadbeef^str.length, h2=0x41c6ce57^str.length;
  for(let i=0;i<str.length;i++){ const ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0');
}
function saveScramble(bytes){ // symmetrisch: dieselbe Funktion codiert und decodiert
  let s=parseInt(saveHash(SAVE_SALT).slice(0,8),16)>>>0;
  const out=new Uint8Array(bytes.length);
  for(let i=0;i<bytes.length;i++){
    s=(s+0x6D2B79F5)>>>0; let t=s;
    t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61);
    out[i]=bytes[i]^((t^(t>>>14))&0xFF);
  }
  return out;
}
function saveEncode(data){
  const json=JSON.stringify(data);
  const wrap=JSON.stringify({ f:SAVE_FORMAT, id:SAVE_ROOM_ID, s:saveHash(SAVE_SALT+'|'+SAVE_ROOM_ID+'|'+json), d:json });
  const bytes=saveScramble(new TextEncoder().encode(wrap));
  let bin=''; for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return btoa(bin).replace(/.{1,76}/g,'$&\r\n').trim();
}
function saveDecode(text){ // wirft Error mit schülergerechter Meldung
  const newer='Diese Zwischenstand-Datei stammt aus einer neueren Version des Escape-Rooms. Bitte lade die Seite neu und versuche es noch einmal.';
  const m=/-----BEGIN ZWISCHENSTAND(?: V(\d+))?-----/.exec(text);   // künftige Formate tragen ihre Nummer im Marker
  const b=m?text.indexOf(SAVE_END,m.index):-1;
  if(!m||b<0) throw new Error('Das ist keine Zwischenstand-Datei. Bitte wähle die Datei „Zwischenstand zum Escape-Room '+SAVE_GAME_TITLE+' vom … von …“ aus.');
  if(m[1]&&+m[1]>SAVE_FORMAT) throw new Error(newer);
  const broken='Diese Zwischenstand-Datei wurde verändert oder ist beschädigt und kann nicht geladen werden.';
  let wrap;
  try{
    const bin=atob(text.slice(m.index+m[0].length,b).replace(/[^A-Za-z0-9+/=]/g,''));
    const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    wrap=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(saveScramble(bytes)));
  }catch(e){ throw new Error(broken); }
  if(!wrap||typeof wrap.d!=='string'||typeof wrap.id!=='string'||wrap.s!==saveHash(SAVE_SALT+'|'+wrap.id+'|'+wrap.d)) throw new Error(broken);
  let data; try{ data=JSON.parse(wrap.d); }catch(e){ throw new Error(broken); }
  if(wrap.id!==SAVE_ROOM_ID) throw new Error('Diese Zwischenstand-Datei gehört zu einem anderen Escape-Room'+(data&&data.game?' („'+data.game+'“)':'')+'. Bitte öffne den passenden Escape-Room.');
  if(wrap.f>SAVE_FORMAT) throw new Error(newer);
  if(!data||typeof data!=='object'||!data.state||typeof data.state!=='object'||typeof data.screen!=='string') throw new Error(broken);
  return data;
}

function saveTwo(n){ return String(n).padStart(2,'0'); }
function saveFmtDate(d){ d=new Date(d); return saveTwo(d.getDate())+'.'+saveTwo(d.getMonth()+1)+'.'+d.getFullYear(); }
function saveFmtDateTime(d){ d=new Date(d); if(isNaN(d)) return '–'; return saveFmtDate(d)+' um '+saveTwo(d.getHours())+':'+saveTwo(d.getMinutes())+' Uhr'; }
function saveStudentName(){ return ((state.firstName||'')+' '+(state.lastName||'')).trim(); }
function saveFileName(d){
  const clean=s=>String(s||'').replace(/[\\/:*?"<>|\u0000-\u001F]+/g,' ').replace(/\s+/g,' ').trim();
  return clean('Zwischenstand zum Escape-Room '+SAVE_GAME_TITLE+' vom '+saveFmtDate(d)+' von '+(saveStudentName()||'Unbekannt'))+'.txt';
}

/* Toast-Meldung (unten, blendet sich selbst aus) */
let saveToastTimer=null;
// Die Meldefläche gibt es von Anfang an (leer): Eine Live-Region, die erst mit ihrem Text entsteht, liest kaum ein Screenreader vor.
function saveToastEl(){
  let t=document.getElementById('saveToast');
  if(!t){ t=document.createElement('div'); t.id='saveToast'; t.className='save-toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
  return t;
}
function showSaveToast(msg,isError){
  const t=saveToastEl();
  t.setAttribute('role',isError?'alert':'status');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(saveToastTimer);
  saveToastTimer=setTimeout(()=>{ t.classList.remove('show'); saveToastTimer=setTimeout(()=>{ t.textContent=''; t.setAttribute('role','status'); },400); },6000);
}

/* ---------- Speichern ---------- */
window.saveProgress=()=>{
  try{
    const now=new Date();
    const target=saveResumeTarget(state.screen);
    const snap=JSON.parse(JSON.stringify(state));
    snap.screen=target;
    const data={ v:SAVE_FORMAT, game:SAVE_GAME_TITLE, savedAt:now.toISOString(), screen:target, place:saveScreenLabel(target), state:snap, extra:saveCollectExtra() };
    const name=saveStudentName()||'Unbekannt';
    const NL='\r\n';
    const text='\uFEFF'
      +'Zwischenstand zum Escape-Room „'+SAVE_GAME_TITLE+'“'+NL
      +'Name: '+name+NL
      +'Gespeichert am '+saveFmtDateTime(now)+' ('+data.place+')'+NL+NL
      +'So geht es weiter: Öffne den Escape-Room und klicke auf der Startseite ganz unten auf'+NL
      +'„Zwischenstand aus Datei laden und weiterspielen“. Lade dann diese Datei hoch.'+NL
      +'Bitte verändere diese Datei nicht – sonst kann sie nicht mehr geladen werden.'+NL+NL
      +SAVE_BEGIN+NL+saveEncode(data)+NL+SAVE_END+NL;
    const filename=saveFileName(now);
    // application/octet-stream: Der Browser speichert die Datei, statt sie nur anzuzeigen.
    const url=URL.createObjectURL(new Blob([text],{type:'application/octet-stream'}));
    const link=document.createElement('a');
    link.href=url; link.download=filename; link.style.display='none';
    document.body.appendChild(link); link.click();
    // Object-URL lange gültig lassen: iOS liest den Blob erst, wenn der Download-Dialog bestätigt ist.
    setTimeout(()=>{ try{ document.body.removeChild(link); }catch(_){} URL.revokeObjectURL(url); },60000);
    showSaveToast('Zwischenstand gespeichert. Du findest die Datei in deinem Download-Ordner.');
  }catch(e){ console.error(e); showSaveToast('Der Zwischenstand konnte nicht gespeichert werden. Bitte versuche es noch einmal.',true); }
};

/* ---------- Speicher-Button am Seitenende (bzw. im Platzhalter data-save-slot des Finales) ---------- */
function refreshSaveBar(){
  const box=document.getElementById(SAVE_CONTAINER_ID); if(!box) return;
  const bar=document.getElementById('saveBar');
  if(!saveScreenAllowed(state.screen)){ if(bar) bar.remove(); return; }
  const slot=box.querySelector('[data-save-slot]')||box;
  if(bar&&bar.parentNode===slot&&slot.lastElementChild===bar) return;
  if(bar) bar.remove();
  slot.insertAdjacentHTML('beforeend',
    '<div class="save-bar" id="saveBar"><button type="button" class="btn ghost save-btn" onclick="saveProgress()" '
    +'title="Lädt eine Datei mit deinem bisherigen Fortschritt herunter. Damit kannst du später an dieser Stelle weiterspielen.">'
    +SAVE_ICON+'<span>Zwischenstand als Datei speichern</span></button></div>');
}
// Jede Bildschirm-Änderung ersetzt den Inhalt des Bildschirm-Containers – dann Button prüfen.
new MutationObserver(refreshSaveBar).observe(document.getElementById(SAVE_CONTAINER_ID),{childList:true});

/* ---------- Feld auf der Startseite ---------- */
function saveLoadFieldHtml(){
  return '<button type="button" class="save-load-field" onclick="renderResume()">'+LOAD_ICON
    +'<span>Zwischenstand aus Datei laden und weiterspielen</span></button>';
}

/* ---------- Laden ---------- */
function saveApplyState(snap){
  Object.keys(state).forEach(k=>{
    if(k==='screen'||!(k in snap)) return;
    const cur=state[k], val=snap[k];
    if(k==='completedAt'){ state[k]=val?new Date(val):null; return; }
    if(Array.isArray(cur)){ if(Array.isArray(val)) state[k]=val; return; }
    if(cur===null||val===null||typeof cur===typeof val) state[k]=val;
  });
  state.resumeLog=Array.isArray(state.resumeLog)?state.resumeLog.filter(e=>e&&typeof e==='object'&&typeof e.place==='string'):[];
}
// Inhalt einer Zwischenstand-Datei prüfen und vereinheitlichen, bevor er übernommen wird: dieselben Regeln wie beim Start,
// genau 6 Stationen, Versuche als Ganzzahlen, Fehler als kurze Texte, Bildschirm passend zum Fortschritt. Sonst abgelehnt.
// (Die Prüfsumme steht im öffentlichen Code – das ist ein Schutz gegen Beschädigung und Unsinn, kein Beweis.)
function saveCheckData(data){
  const broken='Diese Zwischenstand-Datei wurde verändert oder ist beschädigt und kann nicht geladen werden.';
  const bad=()=>{ throw new Error(broken); };
  const sn=data.state, str=v=>typeof v==='string';
  const six=(a,f)=>{ if(!Array.isArray(a)||a.length!==6) bad(); return a.map(f); };
  const fn=cleanInput(sn.firstName), ln=cleanInput(sn.lastName), bd=str(sn.birthDate)?sn.birthDate:'', k=normKlasse(str(sn.klasse)?sn.klasse:'');
  const nameOk=x=>x.length>=2 && x.length<=40 && /\p{L}/u.test(x) && pdfPrintable(x);
  if(!nameOk(fn)||!nameOk(ln)) bad();
  const m=/^(\d{2})\.(\d{2})\.(\d{4})$/.exec(bd); if(!m) bad();
  const dt=new Date(+m[3],+m[2]-1,+m[1]);
  if(dt.getFullYear()!==+m[3]||dt.getMonth()!==+m[2]-1||dt.getDate()!==+m[1]||+m[3]<1950||dt>new Date()) bad();
  if(!/^[\p{L}\p{N}/-]{1,10}$/u.test(k)||!pdfPrintable(k)) bad();
  const solved=six(sn.solved,v=>{ if(typeof v!=='boolean') bad(); return v; });
  const attempts=six(sn.attempts,v=>{ if(!Number.isInteger(v)||v<0||v>999) bad(); return v; });
  const cut=v=>str(v)?cleanLine(v,2000):'';
  const mistakes=six(sn.mistakes,v=>{
    if(v===null) return null;
    if(!v||typeof v!=='object'||!Array.isArray(v.errors)||v.errors.length>200) bad();
    return { errors:v.errors.map(e=>{
      if(!e||typeof e!=='object'||!str(e.item)||!e.item.trim()) bad();
      const o={};   // Reihenfolge der Felder wie beim Speichern (kind, item, wrong, right)
      if(str(e.kind)) o.kind=e.kind.slice(0,20);
      o.item=cut(e.item);
      if(str(e.wrong)) o.wrong=cut(e.wrong);
      if(str(e.right)) o.right=cut(e.right);
      return o; }) };
  });
  // Stationen nur der Reihe nach; gelöst heißt: mindestens ein Versuch
  const done=solved.filter(Boolean).length;
  solved.forEach((v,i)=>{ if(v!==(i<done) || (v && attempts[i]<1)) bad(); });
  let completedAt=null;
  if(sn.completedAt!=null){ if(!str(sn.completedAt)||isNaN(new Date(sn.completedAt))) bad(); completedAt=sn.completedAt; }
  const scr=data.screen; let mm;
  const okScreen = scr==='final' ? done===6
    : scr==='globe' ? done>=1 && done<6
    : (mm=/^(lib|room)([1-6])$/.exec(scr)) ? done===+mm[2]-1
    : scr==='intro' ? done===0 : false;
  if(!okScreen) bad();
  const log=Array.isArray(sn.resumeLog)?sn.resumeLog.filter(e=>e&&typeof e==='object'&&str(e.place)).slice(-50)
    .map(e=>({ place:cleanLine(e.place,200), savedAt:str(e.savedAt)?e.savedAt:'', loadedAt:str(e.loadedAt)?e.loadedAt:'' })):[];
  return { screen:scr, state:{ firstName:fn, lastName:ln, birthDate:bd, klasse:k, code:computeCode(m[1]+m[2]+m[3]),
    solved, letters:solved.map((v,i)=>v?CODE_WORD[i]:'_'), mistakes, attempts, completedAt, resumeLog:log,
    pdfDownloaded:sn.pdfDownloaded===true } };
}
function saveLoadText(text){
  const data=saveDecode(text);
  const checked=saveCheckData(data);
  data.state=checked.state;
  saveApplyState(data.state);
  saveApplyExtra(data.extra||{},data);
  state.resumeLog.push({ place:String(data.place||saveScreenLabel(data.screen)), savedAt:String(data.savedAt||''), loadedAt:new Date().toISOString() });
  saveGoTo(data.screen);
  window.scrollTo({top:0,behavior:'instant'});
  showSaveToast('Willkommen zurück'+(state.firstName?', '+state.firstName:'')+'! Dein Zwischenstand vom '+saveFmtDateTime(data.savedAt)+' wurde geladen.');
}
function saveHandleFile(file){
  const err=document.getElementById('saveLoadError');
  const fail=msg=>{ if(err){ err.style.display='block'; err.textContent=msg; } };
  if(err) err.style.display='none';
  if(!file) return;
  // Eine PDF-Datei (z. B. die Überblick-PDF) gehört ins Feiditor-Feibeitsblatt, nicht hierher.
  file.slice(0,5).text().then(head=>{
    if(head==='%PDF-') fail(FB_CODE?'Das ist eine PDF-Datei. Deine Überblick-PDF lädst du im Feiditor-Feibeitsblatt hoch: feibeitsblatt.janrickmer.de → „Zwischenstand-PDF hochladen“.':'Das ist eine PDF-Datei. Hier brauchst du deine Zwischenstand-Datei (.txt) – sie liegt meistens in deinem Download-Ordner.');
    else saveReadFile(file,fail);
  },()=>saveReadFile(file,fail));
}
function saveReadFile(file,fail){
  if(file.size>2*1024*1024){ fail('Diese Datei ist zu groß für eine Zwischenstand-Datei.'); return; }
  const fr=new FileReader();
  fr.onload=()=>{ try{ saveLoadText(String(fr.result||'')); }catch(e){ console.warn(e); fail(e.message); } };
  fr.onerror=()=>fail('Die Datei konnte nicht gelesen werden. Bitte versuche es noch einmal.');
  fr.readAsText(file,'utf-8');
}
window.renderResume=()=>{
  state.screen='resume';
  saveRenderResumeScreen();   // Anpassung: zeichnet die Upload-Seite (IDs saveDrop, saveFileInput, saveLoadError)
  const input=document.getElementById('saveFileInput'), drop=document.getElementById('saveDrop');
  input.addEventListener('change',()=>{ saveHandleFile(input.files&&input.files[0]); input.value=''; });
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,()=>drop.classList.add('drag')));
  drop.addEventListener('dragleave',()=>drop.classList.remove('drag'));
};
// Dateien, die irgendwo auf der Upload-Seite abgelegt werden, laden (statt sie im Browser zu öffnen).
document.addEventListener('dragover',e=>{ if(state.screen==='resume') e.preventDefault(); });
document.addEventListener('drop',e=>{
  if(state.screen!=='resume') return;
  e.preventDefault();
  const drop=document.getElementById('saveDrop'); if(drop) drop.classList.remove('drag');
  saveHandleFile(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]);
});
function saveDropHtml(){
  return '<label class="save-drop" id="saveDrop">'+LOAD_ICON
    +'<span><strong>Zwischenstand-Datei auswählen</strong><br>oder hierher ziehen</span>'
    +'<input type="file" id="saveFileInput" accept=".txt,text/plain"></label>'
    +'<div id="saveLoadError" class="input-error" role="alert"></div>';
}

/* ---------- Vermerk für die Überblick-PDF ---------- */
function saveLogPdfLines(){
  const log=Array.isArray(state.resumeLog)?state.resumeLog:[];
  if(!log.length) return ['Es wurde keine Zwischenstand-Datei geladen.'];
  const lines=[log.length===1?'Es wurde 1-mal eine Zwischenstand-Datei geladen:':'Es wurde '+log.length+'-mal eine Zwischenstand-Datei geladen:'];
  log.forEach((e,i)=>lines.push((i+1)+'. Weitergespielt ab '+e.place+' (Datei gespeichert am '+saveFmtDateTime(e.savedAt)+', geladen am '+saveFmtDateTime(e.loadedAt)+').'));
  return lines;
}


/* ============================================================
   INIT
   ============================================================ */
saveToastEl();
renderStart();
</script>
